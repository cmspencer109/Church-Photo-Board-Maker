name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # The checks are independent of each other, so one failing shouldn't mask
      # the rest — a PR should show every problem in a single run, not one per
      # push. They do all depend on the install, though: without this guard a
      # failed install reports the same error four more times.
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run format:check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run typecheck

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run build
